version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - typescript
    commit-message:
      prefix: "build(deps)"
    groups:
      typescript-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "build(deps)"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
