name: python

on:
  push:
    branches: [main]
    tags: ['python-v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (py-dgii-ecf)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Verify lockfile matches pyproject.toml
        # `uv sync --frozen` installs from the lock without validating it
        # against pyproject.toml, so a stale lock would otherwise ship
        # unnoticed. This check fails the job when the two disagree.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      # Independent XMLDSig gate: sign a fixture and verify it with libxmlsec1.
      - name: Verify signature with libxmlsec1
        run: uv run --with xmlsec python scripts/verify_signing.py

      - name: Build
        run: uv build

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: ci
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/py-dgii-ecf
    # OIDC trusted publishing — no PYPI_TOKEN. `contents: read` is required
    # so actions/checkout can read the repository.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build
        run: uv build

      - name: Publish (OIDC trusted publishing, no token)
        run: uv publish
