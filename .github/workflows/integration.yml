name: integration

# Opt-in only. These suites submit real documents to a DGII certification
# environment, which consumes an authorised sequence number per run — so they
# never run on push or on a pull request. Dispatch them deliberately, with a
# freshly authorised DGII_ENCF / DGII_RFCE_ENCF repository variable.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [both, python, typescript]
        default: both

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-credentials:
    name: Check DGII credentials
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.DGII_P12_BASE64 }}
          PASSWORD: ${{ secrets.DGII_P12_PASSWORD }}
          RNC: ${{ secrets.DGII_RNC }}
        run: |
          if [ -n "$P12" ] && [ -n "$PASSWORD" ] && [ -n "$RNC" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DGII secrets are not configured; skipping the integration suites."
          fi

  python:
    name: Integration (py-dgii-ecf)
    needs: detect-credentials
    if: >-
      needs.detect-credentials.outputs.available == 'true' &&
      (inputs.suite == 'both' || inputs.suite == 'python')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Decode certificate
        env:
          P12_BASE64: ${{ secrets.DGII_P12_BASE64 }}
        run: |
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/identity.p12"
          chmod 600 "$RUNNER_TEMP/identity.p12"

      - name: Run integration tests
        env:
          DGII_P12_PATH: ${{ runner.temp }}/identity.p12
          DGII_P12_PASSWORD: ${{ secrets.DGII_P12_PASSWORD }}
          DGII_RNC: ${{ secrets.DGII_RNC }}
          DGII_ENVIRONMENT: ${{ vars.DGII_ENVIRONMENT || 'CerteCF' }}
          DGII_ENCF: ${{ vars.DGII_ENCF }}
          DGII_RFCE_ENCF: ${{ vars.DGII_RFCE_ENCF }}
        run: uv run pytest tests/integration -v

      - name: Remove certificate
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/identity.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/identity.p12"

  typescript:
    name: Integration (@deuriib/dgii-ecf)
    needs: detect-credentials
    if: >-
      needs.detect-credentials.outputs.available == 'true' &&
      (inputs.suite == 'both' || inputs.suite == 'typescript')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Decode certificate
        env:
          P12_BASE64: ${{ secrets.DGII_P12_BASE64 }}
        run: |
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/identity.p12"
          chmod 600 "$RUNNER_TEMP/identity.p12"

      - name: Run integration tests
        env:
          DGII_P12_PATH: ${{ runner.temp }}/identity.p12
          DGII_P12_PASSWORD: ${{ secrets.DGII_P12_PASSWORD }}
          DGII_RNC: ${{ secrets.DGII_RNC }}
          DGII_ENVIRONMENT: ${{ vars.DGII_ENVIRONMENT || 'CerteCF' }}
          DGII_ENCF: ${{ vars.DGII_ENCF }}
          DGII_RFCE_ENCF: ${{ vars.DGII_RFCE_ENCF }}
        run: bun run vitest run test/integration

      - name: Remove certificate
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/identity.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/identity.p12"
