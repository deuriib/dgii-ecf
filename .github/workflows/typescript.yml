name: typescript

on:
  push:
    branches: [main]
    tags: ["typescript-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (@deuriib/dgii-ecf)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  publish:
    name: Publish to npm
    needs: ci
    if: startsWith(github.ref, 'refs/tags/typescript-v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
