site_name: DGII e-CF SDKs
site_description: Electronic invoicing SDKs for the Dominican Republic's DGII e-CF system.
site_url: https://deuriib.github.io/dgii-ecf/
repo_url: https://github.com/deuriib/dgii-ecf
repo_name: deuriib/dgii-ecf
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - TypeScript: typescript.md
  - Python: python.md
  - Guides:
      - Signing (XMLDSig): guides/signing.md
      - Resilience & idempotency: guides/resilience.md
      - Releases & publishing: guides/releases.md
  - Examples: examples.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        # `es` is listed first on purpose: the plugin has no per-locale 404
        # page support, so the last built locale wins the shared `404.html`.
        # Building `en` last keeps that shared page in the default language.
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Installation: Instalación
            TypeScript: TypeScript
            Python: Python
            Guides: Guías
            Signing (XMLDSig): Firma (XMLDSig)
            Resilience & idempotency: Resiliencia e idempotencia
            Releases & publishing: Lanzamientos y publicación
            Examples: Ejemplos
            FAQ: Preguntas frecuentes
        - locale: en
          default: true
          name: English
          build: true
