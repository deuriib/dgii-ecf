site_name: DGII e-CF SDKs
site_description: Electronic invoicing SDKs for the Dominican Republic's DGII e-CF system.
site_url: https://deuriib.github.io/dgii-ecf/
repo_url: https://github.com/deuriib/dgii-ecf
repo_name: deuriib/dgii-ecf
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    # `custom` means the palette comes from `docs/stylesheets/extra.css`: the
    # stock teal fails WCAG 2.0 AA contrast (3.76:1) on nav links and header text.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - TypeScript: typescript.md
  - Python: python.md
  - Guides:
      - End-to-end flow: guides/flow.md
      - Signing (XMLDSig): guides/signing.md
      - Resilience & idempotency: guides/resilience.md
      - Releases & publishing: guides/releases.md
  - Reference:
      - Official DGII references: reference/dgii-official.md
  - Examples: examples.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  # `lang` is declared here, not handed to the theme by the i18n plugin's
  # `reconfigure_search`: that option rewrites the search config at build time
  # and leaves the browser with a worker that never returns results (verified
  # in Chromium against the deployed site — the index loaded, the results pane
  # stayed empty). See docs review finding F-DOCS-01.
  - search:
      lang: [en, es]
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: false
      languages:
        # `es` is listed first on purpose: the plugin has no per-locale 404
        # page support, so the last built locale wins the shared `404.html`.
        # Building `en` last keeps that shared page in the default language.
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Installation: Instalación
            TypeScript: TypeScript
            Python: Python
            Guides: Guías
            End-to-end flow: Flujo de extremo a extremo
            Signing (XMLDSig): Firma (XMLDSig)
            Resilience & idempotency: Resiliencia e idempotencia
            Releases & publishing: Lanzamientos y publicación
            Reference: Referencia
            Official DGII references: Referencias oficiales de la DGII
            Examples: Ejemplos
            FAQ: Preguntas frecuentes
        - locale: en
          default: true
          name: English
          build: true
