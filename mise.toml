# mise.toml — tool versions + convenience tasks for the dgii-ecf monorepo.
# Run `mise install` once, then `mise run <task>`.

[tools]
bun = "1.4.4"
node = "26.13.0"
pre-commit = "4.7.0"
python = "3.12"
uv = "0.13.6"
"aqua:gitleaks/gitleaks" = "8.30.1"

# ---------------------------------------------------------------------------
# Bootstrap
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "Install all toolchains and dependencies"
depends = ["bootstrap-tools", "bootstrap-typescript", "bootstrap-python", "hooks-install"]

[tasks.bootstrap-tools]
description = "Install pinned toolchain versions"
run = "mise install"

[tasks.bootstrap-typescript]
description = "Install TypeScript package dependencies"
dir = "packages/typescript"
run = "bun install"

[tasks.bootstrap-python]
description = "Install Python package dependencies"
dir = "packages/python"
run = "uv sync"

# ---------------------------------------------------------------------------
# Git hooks
# ---------------------------------------------------------------------------
[tasks.hooks-install]
description = "Install the pre-commit git hooks (pre-commit + commit-msg)"
run = "pre-commit install --install-hooks && pre-commit install --hook-type commit-msg"

[tasks.hooks]
description = "Run every pre-commit hook against the whole repository"
run = "pre-commit run --all-files"

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tasks.lint]
description = "Run every linter/formatter across the monorepo"
depends = ["lint-typescript", "lint-python", "lint-format"]

[tasks.lint-typescript]
description = "Typecheck + format-check the TypeScript package"
dir = "packages/typescript"
run = "bun run lint"

[tasks.lint-python]
description = "Ruff + mypy + format-check the Python package"
dir = "packages/python"
run = "uv run ruff check . && uv run ruff format --check . && uv run mypy src"

[tasks.lint-format]
description = "Prettier format-check over the whole repository"
# Runs from the repository root so the root `.prettierrc.json` and
# `.prettierignore` both apply — `bun run lint` only sees packages/typescript.
run = "packages/typescript/node_modules/.bin/prettier --check ."

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
[tasks.test]
description = "Run every test suite across the monorepo"
depends = ["test-typescript", "test-python"]

[tasks.test-typescript]
description = "Run the TypeScript (vitest) test suite"
dir = "packages/typescript"
run = "bun run test"

[tasks.test-python]
description = "Run the Python (pytest) test suite"
dir = "packages/python"
run = "uv run pytest"

# Requires the `xmlsec1` binary — this is the independent verification gate,
# not part of `mise run test` so the unit suite stays dependency-free.
[tasks.verify-signing-typescript]
description = "Verify TypeScript SDK signatures with libxmlsec1"
dir = "packages/typescript"
run = "bun run scripts/verify-signing.ts"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[tasks.build]
description = "Build every distributable across the monorepo"
depends = ["build-typescript", "build-python"]

[tasks.build-typescript]
description = "Build the TypeScript package (dist/)"
dir = "packages/typescript"
run = "bun run build"

[tasks.build-python]
description = "Build the Python sdist + wheel (dist/)"
dir = "packages/python"
run = "uv build"

# ---------------------------------------------------------------------------
# Docs
# ---------------------------------------------------------------------------
[tasks.docs-build]
description = "Build the docs site (en + es) with strict validation"
run = "uvx --from mkdocs --with mkdocs-material --with \"mkdocs-static-i18n>=1.0,<2\" mkdocs build --strict"

[tasks.docs-serve]
description = "Serve the docs site locally with live reload"
run = "uvx --from mkdocs --with mkdocs-material --with \"mkdocs-static-i18n>=1.0,<2\" mkdocs serve"

# ---------------------------------------------------------------------------
# Full CI
# ---------------------------------------------------------------------------
[tasks.ci]
description = "Full CI pipeline locally (lint + test + build)"
depends = ["lint", "test", "build"]
